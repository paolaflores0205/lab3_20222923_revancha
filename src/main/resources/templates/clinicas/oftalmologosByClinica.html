<h2> Lista de Oftalmologos</h2>
<!--<a class="btn btn-primary mt-4 mb-4" th:href="@{'/clinicas/lista'}">Nuevo Distribuidora</a>-->
<table class="table table-sm">
    <tr>
        <th>#</th>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Clinica</th>

    </tr>
    <tr th:each="oft, info : ${listaOftalmologosByIdClinica}">
        <td th:text="${info.index +1}"></td>
        <td th:text="${oft.nombre}"></td>
        <td th:text="${oft.correo}"></td>
        <td th:text="${oft.clinica.nombre}"></td>
    </tr>
</table>
