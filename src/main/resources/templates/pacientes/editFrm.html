<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

</head>
<body>

<h2>Editar Paciente</h2>
<form method="post" th:action="@{'/pacientes/guardar'}">
    <input th:value="${paciente.id}" name="id" type="hidden">
    <div class="form-group">
        <label for="nombre">Nombre</label>
        <input th:value="${paciente.nombre}" name="nombre" type="text" class="form-control" id="nombre" readonly>
    </div>
    <div class="form-group">
        <label for="edad">Edad</label>
        <input th:value="${paciente.edad}" name="edad" type="text" class="form-control" id="edad"readonly>
    </div>
    <div class="form-group">
        <label for="genero">Género</label>
        <input th:value="${paciente.genero}" name="genero" type="text" class="form-control" id="genero" readonly>
    </div>
    <div class="form-group">
        <label for="diagnostico">Diagnostico</label>
        <input th:value="${paciente.diagnostico}" name="diagnostico" type="text" class="form-control" id="diagnostico" readonly>
    </div>
    <div class="form-group">
        <label for="numero_habitacion">Nro Habitación</label>
        <input th:value="${paciente.numero_habitacion}" name="numero_habitacion" type="text" class="form-control" id="numero_habitacion" >
    </div>
    <div class="form-group">
        <label for="fecha_cita">Fecha de la cita</label>
        <input th:value="${paciente.fecha_cita}" name="fecha_cita" type="text" class="form-control" id="fecha_cita" readonly>
    </div>

    <a th:href="@{'/pacientes/listar'}" class="btn btn-danger">Cancelar</a>
    <button type="submit" class="btn btn-primary">Actualizar</button>

</form>

</body>
</html>
