<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title> Lista de Pacientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

</head>


<body class="bg-light">


<h2> Lista de Pacientes</h2>
<!--<a class="btn btn-primary mt-4 mb-4" th:href="@{'/clinicas/lista'}">Nuevo Distribuidora</a>-->
<table class="table table-sm">
    <tr>
        <th>#</th>
        <th>Nombre</th>
        <th>Edad</th>
        <th>Genero</th>
        <th>Diagnostico</th>
        <th>Fecha de Cita</th>
        <th>Nro Habitacion</th>
        <th>Oftalmologo</th>
        <th>Clinica</th>

    </tr>
    <tr th:each="px, info : ${listaPacientesByIdOft}">
        <td th:text="${info.index +1}"></td>
        <td th:text="${px.nombre}"></td>
        <td th:text="${px.edad}"></td>
        <td th:text="${px.genero}"></td>
        <td th:text="${px.diagnostico}"></td>
        <td th:text="${px.fecha_cita}"></td>
        <td th:text="${px.numero_habitacion}"></td>
        <td th:text="${px.oftalmologo.nombre}"></td>
        <td th:text="${px.clinica.nombre}"></td>
    </tr>
</table>

</body>
</html>
