<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title> Lista de Clinicas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

</head>


<body class="bg-light">


<header class="p-3 bg-dark text-white mb-4">
    <div class="container d-flex justify-content-center">
        <a th:href="@{/clinicas/lista}" class="btn btn-outline-light me-2">Clínicas</a>
        <a th:href="@{/oftalmologos/lista}" class="btn btn-outline-light me-2">Oftalmólogos</a>
        <a th:href="@{/pacientes/lista}" class="btn btn-outline-light">Pacientes</a>
    </div>
</header>


<h2> Lista de Clinicas</h2>
<!--<a class="btn btn-primary mt-4 mb-4" th:href="@{'/clinicas/lista'}">Nuevo Distribuidora</a>-->
<table class="table table-sm">
    <tr>
        <th>#</th>
        <th>Nombre</th>
        <th>Direccion</th>
        <th>Telefono</th>
        <th></th>
        <th></th>
    </tr>
    <tr th:each="clinica, info : ${listaClinicas}">
        <td th:text="${info.index +1}"></td>
        <td th:text="${clinica.nombre}"></td>
        <td th:text="${clinica.direccion}"></td>
        <td th:text="${clinica.telefono}"></td>
        <td><a class="btn btn-primary"
               th:href="@{'/clinicas/mostrarOftalmologos' + '?idClinica=' + ${clinica.id}}">Mostrar Oftalmologos</a></td>
        <td><a class="btn btn-primary"
               th:href="@{'/clinicas/mostrarPacientes' + '?idClinica=' + ${clinica.id}}">Mostrar Pacientes</a></td>
    </tr>
</table>
